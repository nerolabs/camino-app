# Keeps the free-tier camino-staging Supabase project (gsnsgfobfswazqhfcstx) from
# auto-pausing: Supabase pauses free projects after 7 days without API activity, and
# staging only sees traffic when someone is actively developing (DEPLOY.md — it backs
# camino--staging.expo.app and local `expo start`). One anonymous REST request counts
# as activity; twice a week keeps clear of the 7-day threshold.
#
# A FAILING run means staging is unreachable — most likely already paused (restore it
# from the Supabase dashboard) — so the failure email is itself the alert.
#
# Requires repo secret STAGING_SUPABASE_ANON_KEY (the EXPO_PUBLIC anon key — RLS-safe,
# kept out of git anyway).
name: Staging keepalive

on:
  schedule:
    - cron: '0 7 * * 1,4' # Mondays + Thursdays 07:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping staging Supabase REST API
        run: |
          # An anon table select (RLS returns []) — the bare /rest/v1/ root 401s for
          # new-style publishable keys ("Only secret API keys can be used").
          HTTP=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            "https://gsnsgfobfswazqhfcstx.supabase.co/rest/v1/profiles?select=*&limit=1" \
            -H "apikey: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}")
          echo "HTTP $HTTP"
          [ "$HTTP" = "200" ] || { echo "staging Supabase unreachable — probably paused; restore it in the dashboard"; exit 1; }
