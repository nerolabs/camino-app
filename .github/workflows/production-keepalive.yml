# Keeps the free-tier PRODUCTION Supabase project (oftrpaleqtmuvolwsocd) from auto-pausing.
# Supabase pauses free projects after 7 days without API activity. Production backs the LIVE
# app (getcamino.app + the iOS/Android apps) — auth (Google/email sign-in) and saved roadmaps —
# so a pause breaks signed-in features for real users. Early on, real traffic can be sparse
# enough to trip the 7-day threshold, so this is the safety net. One anonymous REST request
# counts as activity; running DAILY (vs staging's twice-weekly) gives margin against GitHub's
# best-effort scheduling, since a paused production DB is a live-app outage.
#
# A FAILING run means production is unreachable — most likely already paused (restore it from
# the Supabase dashboard IMMEDIATELY) — so the failure email is itself the alert.
#
# Requires repo secret PRODUCTION_SUPABASE_ANON_KEY (the EXPO_PUBLIC anon/publishable key —
# RLS-safe, already public in the client bundle, kept out of git anyway).
#
# NOTE: the real long-term fix for a live app is upgrading production to Supabase Pro (no
# auto-pause + daily backups). This keepalive is the stopgap until then.
name: Production keepalive

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC (offset from staging's 07:00)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production Supabase REST API
        run: |
          # An anon table select (RLS returns []) — the bare /rest/v1/ root 401s for
          # new-style publishable keys ("Only secret API keys can be used").
          HTTP=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            "https://oftrpaleqtmuvolwsocd.supabase.co/rest/v1/profiles?select=*&limit=1" \
            -H "apikey: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}")
          echo "HTTP $HTTP"
          [ "$HTTP" = "200" ] || { echo "production Supabase unreachable — probably paused; restore it in the dashboard NOW (live app is down)"; exit 1; }
